<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>MINSEOK 영상 제작 현황</title>
<style>
/* 레이아웃: 위 요약(제목 · 진행 · 목소리 · 음악 · 편집) → 스토리보드 순서 장면 → 최근 기록. 휴대폰에서는 한 줄씩 */
:root {
  --bg: #f5f5f7; --card: #ffffff; --fg: #1d1d1f; --muted: #6e6e73; --line: #e3e3e8;
  --accent: #0071e3; --ok: #248a3d; --ok-bg: #e3f5e8; --run: #b25000; --run-bg: #fff1dc;
  --rev: #8944ab; --rev-bg: #f3e6fa; --wait: #6e6e73; --wait-bg: #ececf0;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
  --round: 18px; color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #000000; --card: #1c1c1e; --fg: #f5f5f7; --muted: #98989d; --line: #2c2c2e;
  --accent: #0a84ff; --ok: #30d158; --ok-bg: #12301b; --run: #ffb340; --run-bg: #3a2a10;
  --rev: #da8fff; --rev-bg: #33203d; --wait: #98989d; --wait-bg: #2c2c2e; color-scheme: dark; } }
* { box-sizing: border-box; }
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font); line-height: 1.5; font-size: 14px;
  padding-inline: 16px; padding-block: 28px 48px; -webkit-font-smoothing: antialiased; }
main { max-width: 860px; margin: 0 auto; display: grid; gap: 28px; }
.eyebrow { font-size: 12px; letter-spacing: .08em; color: var(--muted); font-weight: 600; margin: 0; }
h1 { font-size: clamp(24px, 4.6vw, 34px); line-height: 1.15; margin: 4px 0 6px; letter-spacing: -.01em; text-wrap: balance; }
.sub { color: var(--muted); margin: 0; font-size: 15px; }
.summary { background: var(--card); border-radius: var(--round); padding: 20px; display: grid; gap: 16px; }
.progress { display: grid; gap: 8px; }
.nums { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; font-variant-numeric: tabular-nums; }
.nums b { font-size: 28px; letter-spacing: -.02em; }
.bar { height: 8px; border-radius: 99px; background: var(--wait-bg); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .4s; }
dl { display: flex; flex-wrap: wrap; gap: 8px 28px; margin: 0; }
dt { color: var(--muted); font-size: 12px; }
dd { margin: 0; font-variant-numeric: tabular-nums; }
.parts { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; }
.part { border-radius: 12px; padding: 10px 12px; display: grid; gap: 2px; background: var(--wait-bg); min-width: 0; }
.part span, .part small { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.part b { font-size: 15px; }
.part.ok { background: var(--ok-bg); } .part.ok b { color: var(--ok); }
.part.run { background: var(--run-bg); } .part.run b { color: var(--run); }
h2 { font-size: 20px; margin: 0 0 12px; letter-spacing: -.01em; }
.scenes { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.scene { background: var(--card); border-radius: var(--round); padding: 14px; display: grid;
  grid-template-columns: 28px 76px minmax(0, 1fr); gap: 14px; align-items: start; }
.no { font-size: 20px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; text-align: center; padding-top: 2px; }
.pic { position: relative; width: 76px; aspect-ratio: 9 / 16; max-width: 100%; border-radius: 10px; overflow: hidden; background: var(--wait-bg); }
.pic img { width: 100%; height: 100%; object-fit: cover; display: block; }
.pic .icon { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); }
.script { white-space: pre-line; font-size: 14px; line-height: 1.55; background: var(--wait-bg); border-radius: 10px; padding: 10px 12px; overflow-wrap: anywhere; }
.play { position: absolute; inset: auto 6px 6px 6px; border: 0; border-radius: 99px; padding: 5px 0; font: 600 12px var(--font);
  color: #fff; background: rgba(0, 0, 0, .62); cursor: pointer; }
.play:hover, .play:focus-visible { background: var(--accent); outline: none; }
.body { display: grid; gap: 6px; min-width: 0; }
.head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.sec { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.badge { font-size: 12px; font-weight: 600; border-radius: 99px; padding: 2px 10px; }
.badge.done { color: var(--ok); background: var(--ok-bg); }
.badge.making { color: var(--run); background: var(--run-bg); }
.badge.revising { color: var(--rev); background: var(--rev-bg); }
.badge.waiting { color: var(--wait); background: var(--wait-bg); }
.title { margin: 0; font-size: 15px; overflow-wrap: anywhere; }
.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
.step { font-size: 12px; border-radius: 6px; padding: 1px 8px; background: var(--wait-bg); color: var(--wait); }
.step.ok { background: var(--ok-bg); color: var(--ok); }
.step.run { background: var(--run-bg); color: var(--run); }
.line { border-left: 2px solid var(--line); padding-left: 10px; display: grid; gap: 1px; }
.line .who { font-size: 11px; color: var(--muted); letter-spacing: .04em; }
.line p { margin: 0; overflow-wrap: anywhere; }
.line .en { font-size: 14px; }
.line .ko { font-size: 13px; color: var(--muted); }
.board { background: var(--card); border-radius: var(--round); padding: 6px 20px; list-style: none; margin: 0; display: grid; }
.board li { display: grid; gap: 4px; padding: 12px 0; border-bottom: 1px solid var(--line); min-width: 0; }
.board li:last-child { border-bottom: 0; }
.board .top { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.board .team { font-size: 12px; color: var(--muted); }
.board .ttl { margin: 0; font-size: 15px; overflow-wrap: anywhere; }
.board .meta { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.board .empty { color: var(--muted); font-size: 13px; }
.roles { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 4px; }
.roles li { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; }
.roles .role { color: var(--muted); }
.badge.blue { color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent); }
.badge.purple { color: #8944ab; background: color-mix(in srgb, #8944ab 14%, transparent); }
.pending-h { margin-top: 20px; color: var(--muted); }
.script-box { background: var(--card); border-radius: var(--round); padding: 14px 18px; margin-bottom: 16px; }
.script-box summary { font-weight: 700; font-size: 16px; cursor: pointer; }
.tr-list { display: grid; gap: 12px; margin-top: 12px; }
.tr-row { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 10px; }
.tr-time { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; padding-top: 2px; }
.tr-where { font-size: 11px; color: var(--muted); background: var(--wait-bg); border-radius: 99px; padding: 2px 8px; width: fit-content; display: inline-block; margin-bottom: 2px; }
.tr-txt p { margin: 0; overflow-wrap: anywhere; }
.tr-ko { font-size: 15px; }
.tr-en { font-size: 13px; color: var(--muted); }
.tr-who { font-size: 11px; color: var(--muted); opacity: .8; margin: 0; }
.tr-note { font-size: 12px; color: var(--run); }
.tr-head { font-size: 13px; font-weight: 700; color: var(--muted); margin: 6px 0 0; }
.board.pending { border: 1px dashed var(--line); background: transparent; }
.pend-det summary { cursor: pointer; list-style: none; display: grid; gap: 4px; }
.pend-det summary::-webkit-details-marker { display: none; }
.pend-det summary .top::after { content: "펼치기 ▾"; font-size: 12px; color: var(--accent); margin-left: auto; }
.pend-det[open] summary .top::after { content: "접기 ▴"; }
.pend-body { display: grid; gap: 10px; margin-top: 12px; }
.badge.red { color: #d70015; background: color-mix(in srgb, #d70015 14%, transparent); }
.events { background: var(--card); border-radius: var(--round); padding: 16px 20px; list-style: none; margin: 0;
  display: grid; gap: 6px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.events li { overflow-wrap: anywhere; }
.notice { background: var(--card); border-radius: var(--round); padding: 28px 20px; text-align: center; color: var(--muted); }
footer { color: var(--muted); font-size: 12px; text-align: center; }
dialog { border: 0; padding: 0; border-radius: 20px; background: var(--card); color: var(--fg); width: min(420px, calc(100vw - 32px)); }
dialog::backdrop { background: rgba(0, 0, 0, .55); }
.dlg { display: grid; gap: 10px; padding: 12px; }
.dlg header { display: flex; justify-content: space-between; align-items: center; padding: 0 4px; gap: 12px; }
.dlg button { border: 0; background: var(--wait-bg); color: var(--fg); border-radius: 99px; padding: 6px 14px; font: 600 13px var(--font); cursor: pointer; }
.dlg button:focus-visible { outline: 2px solid var(--accent); }
.dlg video { width: 100%; max-height: 72vh; aspect-ratio: 9 / 16; border-radius: 12px; background: #000; }
@media (max-width: 480px) { .scene { grid-template-columns: 64px minmax(0, 1fr); } .no { display: none; } .pic { width: 64px; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<main id="app">
  <header>
    <p class="eyebrow">MINSEOK · 영상 제작 현황</p>
    <h1 id="title">불러오는 중</h1>
    <p class="sub" id="subtitle"></p>
  </header>
  <div id="content"></div>
  <footer>바뀐 내용은 몇 분 안에 이 페이지에 올라옵니다. 열어 둔 채로 두면 1분마다 다시 확인합니다.</footer>
</main>
<dialog id="player">
  <div class="dlg">
    <header><b id="player-title">장면</b><button type="button" id="player-close">닫기</button></header>
    <video id="player-video" controls playsinline></video>
  </div>
</dialog>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
  const raw = location.hash.slice(1);
  let key = null;

  function b64(s) {
    s = s.replace(/-/g, "+").replace(/_/g, "/"); while (s.length % 4) s += "=";
    return Uint8Array.from(atob(s), c => c.charCodeAt(0));
  }
  async function open(url) {
    const r = await fetch(url + "?t=" + Date.now(), { cache: "no-store" });
    if (!r.ok) throw new Error("파일을 받지 못했습니다 (" + r.status + ")");
    const buf = new Uint8Array(await r.arrayBuffer());
    return crypto.subtle.decrypt({ name: "AES-GCM", iv: buf.slice(0, 12) }, key, buf.slice(12));
  }
  function notice(text) {
    $("title").textContent = "MINSEOK 영상 제작 현황";
    const c = $("content"); c.replaceChildren(el("div", "notice", text));
  }
  const stepCls = s => ({ "완료": "ok", "진행 중": "run" })[s] || "wait";
  const ICONS = {
    script: '<path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5"/><path d="M10 13h6M10 17h6"/>',
    voice: '<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>',
    edit: '<rect x="4" y="6" width="16" height="12" rx="2"/><path d="M4 10h16M8 6v4M12 6v4M16 6v4"/>',
    music: '<path d="M6 4v16M12 4v16M18 4v16"/><circle cx="6" cy="14" r="2"/><circle cx="12" cy="8" r="2"/><circle cx="18" cy="16" r="2"/>',
    final: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M10 9l5 3-5 3z"/>'
  };

  function render(d) {
    $("title").textContent = d.title;
    $("subtitle").textContent = d.subtitle;
    document.title = d.title + " · 제작 현황";
    const c = $("content"); c.replaceChildren();
    const needed = d.scenes.filter(s => s.phase[0] !== "");
    const done = needed.filter(s => s.phase[0] === "done");
    const total = d.scenes.reduce((a, s) => a + Number(s.seconds || 0), 0);
    const pct = needed.length ? Math.round(100 * done.length / needed.length) : 100;

    const sum = el("section", "summary"); sum.setAttribute("aria-label", "요약");
    const prog = el("div", "progress"), nums = el("div", "nums"), left = el("span");
    const isSteps = d.scenes.length && d.scenes.every(s => s.kind === "step");   // 다른 팀 단계 작업
    left.append(el("b", null, String(done.length)), " / " + needed.length + (isSteps ? " 단계 완료" : " 장면 영상 완료"));
    nums.append(left, el("span", "sub", isSteps ? d.scenes.length + "단계" : d.scenes.length + "장면 · " + Math.round(total * 10) / 10 + "초"));
    const bar = el("div", "bar"), fill = el("i"); fill.style.width = pct + "%"; bar.append(fill);
    bar.setAttribute("role", "progressbar"); bar.setAttribute("aria-valuenow", pct);
    prog.append(nums, bar);
    const dl = el("dl");
    const meta = [["시작", d.started], ["마지막 갱신", d.updated]];
    if (d.finish) meta.push(["예상 완료", d.finish + (d.finish_left ? " (" + d.finish_left + " 남음)" : "")]);
    for (const [k, v] of meta) { const g = el("div"); g.append(el("dt", null, k), el("dd", null, v)); dl.append(g); }
    const parts = el("ul", "parts");
    for (const p of d.parts.filter(p => p.state !== "필요 없음")) {
      const li = el("li", "part " + stepCls(p.state));
      li.append(el("span", null, p.name), el("b", null, p.state + (p.count ? " " + p.count : "")));
      if (p.detail) li.append(el("small", null, p.detail));
      parts.append(li);
    }
    sum.append(prog, dl, parts);

    const sec = el("section"); sec.setAttribute("aria-label", "장면");
    function sceneLi(s, noText) {   // noText: 대본 표가 따로 있으면 번역은 표 한 곳에만 (2026-10-16 사용자)
        const li = el("li", "scene");
        const pic = el("div", "pic");
        if (s.thumb) { const im = el("img"); im.src = s.thumb; im.alt = ""; im.loading = "lazy"; pic.append(im); }
        else if (ICONS[s.icon]) {   // 이미지가 없으면 단계 종류 아이콘 (대본 · 녹음 · 영상 이어 붙이기 · 음악 믹싱 · 완성 영상)
          const ic = el("span", "icon"); ic.setAttribute("aria-hidden", "true");
          ic.innerHTML = '<svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">' + ICONS[s.icon] + "</svg>";
          pic.append(ic);
        }
        if (s.video) {
          const b = el("button", "play", "재생"); b.type = "button";
          b.setAttribute("aria-label", s.no + "번 장면 영상 보기");
          b.addEventListener("click", () => play(s, b));
          pic.append(b);
        }
        const body = el("div", "body"), head = el("div", "head");
        if (s.phase[1]) head.append(el("span", "badge " + s.phase[0], s.phase[1]));
        if (s.kind !== "step") head.append(el("span", "sec", s.seconds + "초"));
        body.append(head, el("p", "title", s.title));
        if (s.kind === "step") {   // 다른 팀 작업의 단계: 단계 설명 + 대본 같은 내용
          if (s.detail) body.append(el("p", "ko", s.detail));
          if (s.text && !noText) body.append(el("div", "script", s.text));
        } else if (s.steps.length) {
          const ul = el("ul", "steps");
          for (const [n, st] of s.steps) ul.append(el("li", "step " + stepCls(st), n));
          body.append(ul);
        }
        if (s.line && !noText) {
          const ln = el("div", "line");
          ln.append(el("span", "who", s.line.narration ? "내레이션" : "대사"), el("p", "en", s.line.en), el("p", "ko", s.line.ko));
          body.append(ln);
        }
        li.append(el("span", "no", String(s.no)), pic, body);
      return li;
    }
    // 대본 · 한글 번역 표 하나: 음성 줄과 화면 글자를 시간 순으로, 같은 철자 메모는 한 번만 (2026-10-16 사용자)
    const hasScript = x => !!x && ((x.rows || []).length || (x.screen || []).length);
    const secOf = t => { const m = /^(\d+):(\d+(?:\.\d+)?)/.exec(t || ""); if (m) return +m[1] * 60 + +m[2]; const n = parseFloat(t); return isNaN(n) ? null : n; };
    function scriptTable(x) {
      const items = [];
      (x.rows || []).forEach((r, k) => items.push([secOf(r.time) ?? 0, k, { time: r.time, ko: r.ko, en: r.en, who: r.who, note: r.note }]));
      const n = (x.rows || []).length;
      (x.screen || []).forEach((t, k) => {
        const m = /^[\d.~–-]+초\s*/.exec(t.where || "");
        let s = m ? secOf(m[0]) : null;
        if (s === null) s = /첫|처음|시작/.test(t.where || "") ? 0 : 1e6;
        const tm = !m ? "" : m[0].includes("~") ? m[0].trim() : Math.floor(s / 60) + ":" + (s % 60).toFixed(1).padStart(4, "0");   // "20.7초" → "0:20.7"
        items.push([s, n + k, { time: tm, screen: m ? t.where.slice(m[0].length) : (t.where || ""), ko: t.ko, en: t.en, note: t.note }]);
      });
      items.sort((a, b) => a[0] - b[0] || a[1] - b[1]);
      const tb = el("div", "tr-list"), seen = new Set();
      for (const [, , e] of items) {
        const row = el("div", "tr-row"), right = el("div", "tr-txt");
        if (e.screen !== undefined) right.append(el("span", "tr-where", e.screen ? "화면 · " + e.screen : "화면 글자"));
        right.append(el("p", "tr-ko", e.ko), el("p", "tr-en", e.en));
        if (e.who) right.append(el("p", "tr-who", e.who));
        if (e.note && !seen.has(e.note)) { seen.add(e.note); right.append(el("p", "tr-note", e.note)); }
        row.append(el("span", "tr-time", e.time), right);
        tb.append(row);
      }
      for (const nt of x.notes || []) tb.append(el("p", "tr-who", nt));
      return tb;
    }
    const sc = d.script || {};
    const list = el("ol", "scenes");
    for (const s of d.scenes) list.append(sceneLi(s, hasScript(sc)));
    if (hasScript(sc)) {
      const det = el("details", "script-box"); det.open = true;
      det.append(el("summary", null, "대본 · 한글 번역 (" + (sc.rows || []).length + "줄)"), scriptTable(sc));
      sec.append(det);
    }
    sec.append(el("h2", null, "스토리보드 순서"), list);
    if ((d.pending || []).length) {   // 맨 아래 층: 아직 마무리되지 않은 다른 프로젝트
      const pl = el("ul", "board pending");
      for (const p of d.pending) {
        const li = el("li"), det = el("details", "pend-det"), sm = el("summary"), top = el("div", "top");
        top.append(el("span", "ttl", p.title), el("span", "badge purple", "결과 대기 중"));
        sm.append(top);
        det.append(sm);
        li.append(det);
        if (p.subtitle) li.append(el("span", "meta", p.subtitle));
        const bits = [];
        if (p.total) bits.push("장면 " + p.done + "/" + p.total);
        if (p.edit && p.edit !== "필요 없음") bits.push("편집 " + p.edit);
        if (p.updated) bits.push(p.updated.slice(5, 16));
        if (bits.length) li.append(el("span", "meta", bits.join(" · ")));
        if (p.reason) li.append(el("span", "meta", p.reason));
        // 펼친 내용: 대본 번역(있으면) + 장면 · 단계 (영상은 재생 버튼)
        const inner = el("div", "pend-body");
        const ps = p.script || {};
        if (hasScript(ps)) inner.append(el("p", "tr-head", "대본 · 한글 번역"), scriptTable(ps));
        const pol = el("ol", "scenes");
        for (const s of p.scenes || []) pol.append(sceneLi(s, hasScript(ps)));
        inner.append(pol);
        det.append(inner);
        // 요약 줄(장면 수 · 까닭)은 summary 아래로 옮겨 펼치기 전에도 보이게
        for (const m of [...li.querySelectorAll(":scope > .meta")]) sm.append(m);
        pl.append(li);
      }
      sec.append(el("h2", "pending-h", "결과 대기 중"), pl);
    }

    // 다른 팀 요청 장부 · M4 에서 지금 (2026-10-16 사용자: 다른 팀 요청을 항상 게시하고 진행을 실시간으로)
    const badgeCls = s => ({ "진행 중": "making", "확인 대기": "blue", "완료": "done", "멈춤": "red", "취소": "red" })[s] || "waiting";
    const rq = el("section"); rq.setAttribute("aria-label", "다른 팀 요청");
    const rql = el("ul", "board");
    if (!(d.requests || []).length) rql.append(el("li", "empty", "받은 요청이 없어요"));
    for (const r of d.requests || []) {
      const li = el("li"), top = el("div", "top");
      top.append(el("span", "team", r.team + " · " + r.kind), el("span", "badge " + badgeCls(r.state), r.state));
      li.append(top, el("p", "ttl", r.title));
      if (r.progress > 0 && r.state !== "완료") {
        const b = el("div", "bar"), i = el("i"); i.style.width = Math.round(r.progress * 100) + "%"; b.append(i); li.append(b);
      }
      if (r.detail) li.append(el("span", "meta", r.detail + (r.updated ? " · " + r.updated.slice(-5) : "")));
      rql.append(li);
    }
    rq.append(el("h2", null, "다른 팀 요청"), rql);
    if ((d.roles || []).length) {   // 누가 무엇을 맡는지 (2026-10-16: 게시는 SNS 총괄 관리팀)
      const rl = el("ul", "roles");
      for (const r of d.roles) { const li = el("li"); li.append(el("span", "role", r.role), el("span", "rteam", r.team)); rl.append(li); }
      rq.append(rl);
    }
    const ac = el("section"); ac.setAttribute("aria-label", "M4에서 지금");
    const acl = el("ul", "board");
    if (!(d.activity || []).length) acl.append(el("li", "empty", "지금 도는 무거운 작업이 없어요"));
    for (const a of d.activity || []) {
      const li = el("li"), top = el("div", "top");
      const m = a.minutes < 1 ? "방금" : (a.minutes < 60 ? Math.round(a.minutes) + "분째" : Math.floor(a.minutes / 60) + "시간 " + Math.round(a.minutes % 60) + "분째");
      top.append(el("span", "ttl", a.kind + " · " + a.project), el("span", "badge making", m));
      li.append(top, el("span", "meta", a.what + " · 메모리 " + Math.round(a.memGB) + "GB"));
      acl.append(li);
    }
    ac.append(el("h2", null, "M4에서 지금" + (d.board_time ? " (" + d.board_time.slice(0, 5) + " 기준)" : "")), acl);
    const ev = el("section"); ev.setAttribute("aria-label", "최근 기록");
    const evl = el("ul", "events");
    for (const e of d.events) evl.append(el("li", null, e));
    ev.append(el("h2", null, "최근 기록"), evl);
    c.append(sum, rq, ac, sec, ev);
  }

  const dlg = $("player"), vid = $("player-video");
  let blobUrl = null;
  async function play(s, btn) {
    btn.textContent = "여는 중";
    try {
      const data = await open(s.video);
      if (blobUrl) URL.revokeObjectURL(blobUrl);
      blobUrl = URL.createObjectURL(new Blob([data], { type: "video/mp4" }));
      $("player-title").textContent = s.no + "번 장면";
      vid.src = blobUrl;
      dlg.showModal();
      vid.play().catch(() => {});
    } catch (e) { alert("영상을 열지 못했습니다: " + e.message); }
    btn.textContent = "재생";
  }
  const close = () => { vid.pause(); dlg.close(); };
  $("player-close").addEventListener("click", close);
  dlg.addEventListener("close", () => vid.pause());
  dlg.addEventListener("click", ev => { if (ev.target === dlg) close(); });

  async function refresh() {
    try { render(JSON.parse(new TextDecoder().decode(await open("data.bin")))); }
    catch (e) { if (!document.querySelector(".scene")) notice("현황을 열지 못했습니다. 받은 링크 전체(# 뒤까지)로 열었는지 확인해 주세요."); }
  }
  (async () => {
    if (!raw) { notice("이 페이지는 열쇠가 붙은 링크로만 볼 수 있습니다."); return; }
    try { key = await crypto.subtle.importKey("raw", b64(raw), "AES-GCM", false, ["decrypt"]); }
    catch (e) { notice("링크의 열쇠가 올바르지 않습니다."); return; }
    await refresh();
    setInterval(() => { if (!dlg.open) refresh(); }, 60000);
  })();
})();
</script>
</body>
</html>
